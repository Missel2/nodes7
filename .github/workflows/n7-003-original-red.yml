name: N7-003 original-COTP expected-red

on:
  pull_request:
    paths:
      - 'test/network/**'
      - 'scripts/ci/verify-cotp-baseline-red.cjs'
      - '.github/workflows/n7-003-original-red.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce-original:
    name: Actual fork COTP expected-red (${{ matrix.os }}, Node 22)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install committed dependencies exactly
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify expected original failures by exact assertion identity (not a fix)
        run: node scripts/ci/verify-cotp-baseline-red.cjs
      - name: Preserve actual TCP observations before test fixture cleanup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n7-003-original-red-${{ matrix.os }}-node22
          path: test-reports/
          retention-days: 14
          if-no-files-found: warn
