name: N7-002 lockfile candidate generator (temporary)

on:
  pull_request:
    paths:
      - '.github/workflows/n7-002-lockfile-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Lockfile candidate generation (Ubuntu, Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Record toolchain and baseline lockfile
        run: |
          node --version
          npm --version
          node -p "JSON.stringify({manifest: require('./package.json').version, inheritedLock: require('./package-lock.json').version, inheritedLockfileVersion: require('./package-lock.json').lockfileVersion})"
      - name: Convert inherited lockfile using actual npm registry integrity metadata
        run: npm install --package-lock-only --lockfile-version=3 --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Inspect generated version, integrity, and registry provenance
        run: |
          node - <<'NODE'
          const p=require('./package.json'), l=require('./package-lock.json'), a=require('node:assert/strict');
          a.equal(l.name,p.name);
          a.equal(l.version,p.version);
          a.equal(l.lockfileVersion,3);
          a.equal(l.packages[''].version,p.version);
          a.ok(l.packages['node_modules/iso-on-tcp']?.integrity,'missing runtime dependency integrity');
          let n=0;
          for(const [k,v] of Object.entries(l.packages)) {
            if(!k) continue;
            n++;
            if(!v.link) {
              a.ok(v.integrity, 'missing integrity: '+k);
              a.ok(v.resolved?.startsWith('https://registry.npmjs.org/'), 'non-registry dependency: '+k+' => '+v.resolved);
            }
          }
          console.log('N7-002 candidate: '+n+' locked packages, registry SHA integrity present.');
          NODE
      - name: Prove clean-install and all existing upstream tests
        env:
          TZ: America/Sao_Paulo
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          npm test
          node --test test/bootstrap/api.contract.test.cjs
      - name: Output machine-readable candidate for traceable integration into separate PR
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const b=fs.readFileSync('package-lock.json');
          console.log('N7_LOCK_SHA256='+crypto.createHash('sha256').update(b).digest('hex'));
          const s=b.toString('base64');
          console.log('N7_LOCK_CHUNKS='+Math.ceil(s.length/1800));
          for(let i=0;i<s.length;i+=1800) console.log('N7_LOCK_CHUNK_'+Math.floor(i/1800)+'='+s.slice(i,i+1800));
          console.log('N7_LOCK_END');
          NODE
      - name: Preserve candidate lockfile as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n7-002-lockfile-candidate
          path: package-lock.json
          retention-days: 14
          if-no-files-found: error
